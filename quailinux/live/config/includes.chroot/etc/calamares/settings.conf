---
modules-search:
  - local
  - "/usr/lib/${LIBDIR}/calamares/modules"

instances:
  - id:       packages
    module:   packages
    config:   packages.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - bootloader
      - umount
  - show:
      - finished

branding: quailinux
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
hide-back-and-next-during-exec: false
